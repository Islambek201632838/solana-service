services:
  # ================================================
  # PostgreSQL — закомментирован, используем SQLite
  # ================================================
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - internal

  # ================================================
  # Redis — закомментирован (не нужен для MVP)
  # ================================================
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   networks:
  #     - internal

  # ================================================
  # Backend (FastAPI + SQLite)
  # ================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
      - DECISIONS_DB_PATH=/app/data/decisions.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 300s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  # ================================================
  # AI Agent (Python async + Gemini)
  # ================================================
  ai-agent:
    build:
      context: ../ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DECISIONS_DB_PATH=/app/data/decisions.db
    volumes:
      - ../keys:/app/keys:ro
      - sqlite_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ================================================
  # Activity Simulator (borrow/repay every 10 min)
  # ================================================
  activity-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.activity
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - ANCHOR_PROVIDER_URL=https://api.devnet.solana.com
      - ANCHOR_WALLET=/app/keys/deployer.json
    volumes:
      - ../keys:/app/keys:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ================================================
  # Frontend (React + Vite → nginx)
  # ================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
        VITE_SOLANA_RPC: ${VITE_SOLANA_RPC:-https://api.devnet.solana.com}
        VITE_PROGRAM_ID: ${VITE_PROGRAM_ID:-${PROGRAM_ID}}
    env_file:
      - ../.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ================================================
  # Nginx reverse proxy — serves static + proxies API
  # ================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  sqlite_data:
  frontend_dist:

networks:
  internal:
    driver: bridge
