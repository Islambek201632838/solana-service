  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB}
  #   ports:
  #     - "127.0.0.1:5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - internal

  # ================================================
  # Redis — закомментирован (не нужен для MVP)
  # ================================================
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   networks:
  #     - internal

  # ================================================
  # Backend (FastAPI + SQLite)
  # ================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ================================================
  # AI Agent (Python async + Gemini)
  # ================================================
  ai-agent:
    build:
      context: ../ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../keys:/app/keys:ro
      - sqlite_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ================================================
  # Frontend (React + Vite → nginx)
  # ================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
        VITE_SOLANA_RPC: ${VITE_SOLANA_RPC:-https://api.devnet.solana.com}
        VITE_PROGRAM_ID: ${VITE_PROGRAM_ID}
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ================================================
  # Nginx reverse proxy
  # ================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  sqlite_data:
  # pgdata:

networks:
  internal:
    driver: bridge
